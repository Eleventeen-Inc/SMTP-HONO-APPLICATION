# ============================================================
# SMTP API - Docker Compose
# Runs the API server and Redis on the same VPS
# as the SMTP server (mailserver container).
# ============================================================

services:
  api:
    build: .
    container_name: smtp-api
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      # Mount Docker socket so the API can run "docker exec" commands
      # against the mailserver container for domain management
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smtp-api-network

  redis:
    image: redis:7-alpine
    container_name: smtp-api-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - smtp-api-network

volumes:
  redis-data:
    driver: local

networks:
  smtp-api-network:
    driver: bridge
